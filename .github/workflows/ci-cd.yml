name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir nome da imagem em minusculo
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem
        working-directory: app
        run: docker build -t "app:${{ github.sha }}" .

      - name: Smoke test do container
        run: |
          docker run -d --name smoke -p 8000:8000 "app:${{ github.sha }}"
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "health check OK"
              break
            fi
            echo "aguardando aplicacao subir ($i)"
            sleep 2
          done
          curl -sf http://localhost:8000/health || { docker logs smoke; exit 1; }
          curl -sf -X POST http://localhost:8000/tasks \
            -H 'Content-Type: application/json' \
            -d '{"title":"ci"}' || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da imagem
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          docker tag "app:${{ github.sha }}" "$IMAGE:${{ github.sha }}"
          docker tag "app:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Definir nome da imagem em minusculo
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy na EC2 via SSM
        id: send
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters commands="[
              \"docker pull $IMAGE\",
              \"docker rm -f app || true\",
              \"docker run -d --name app --restart unless-stopped -p 8000:8000 $IMAGE\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Aguardar conclusao do deploy
        run: |
          for _ in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.cmd_id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.send.outputs.cmd_id }}" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
            sleep 6
          done
          echo "timeout aguardando o comando SSM"
          exit 1